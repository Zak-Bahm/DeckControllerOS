# Steam Deck → Xbox-style HID mapping config
#
# Only axis normalization is configurable here. Button and d-pad bit
# positions are fixed by the Deck's hidraw report layout (see
# crates/input/src/reader.rs and docs/mapping.md).
#
# Sticks: range -32767..32767 (Y axes negated by the reader)
# Triggers: range 0..32767

[[axes]]
hid_axis = "lx"
evdev_min = -32767
evdev_max = 32767
deadzone = 4000

[[axes]]
hid_axis = "ly"
evdev_min = -32767
evdev_max = 32767
deadzone = 4000

[[axes]]
hid_axis = "rx"
evdev_min = -32767
evdev_max = 32767
deadzone = 4000

[[axes]]
hid_axis = "ry"
evdev_min = -32767
evdev_max = 32767
deadzone = 4000

[[axes]]
hid_axis = "lt"
evdev_min = 0
evdev_max = 32767

[[axes]]
hid_axis = "rt"
evdev_min = 0
evdev_max = 32767
